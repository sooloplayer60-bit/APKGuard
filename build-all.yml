name: Build APK Guard for Android and Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Guard-Android
          path: app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Windows desktop app
        shell: cmd
        run: desktop\build-windows.bat
        working-directory: .
      - name: Package portable Windows app
        shell: pwsh
        run: Compress-Archive -Path desktop\dist\APKGuard -DestinationPath desktop\dist\APKGuard-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Guard-Windows
          path: desktop/dist/APKGuard-Windows.zip
